<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Floating Button Effect</title>
<style>
  body {
    display: flex;
    height: 100vh;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
  }

  .floating-button {
    position: relative;
    background-color: #6200ea;
    color: white;
    border: none;
    border-radius: 50px;
    padding: 15px 30px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 6px 10px rgba(98, 0, 234, 0.4);
    transition: box-shadow 0.3s ease, transform 0.2s ease;
    overflow: hidden;
  }

  /* Lumulutang effect kapag naka-hover */
  .floating-button:hover {
    box-shadow: 0 12px 20px rgba(98, 0, 234, 0.6);
    transform: translateY(-6px);
  }

  /* Lumulutang effect kapag naka-press */
  .floating-button:active {
    box-shadow: 0 4px 8px rgba(98, 0, 234, 0.3);
    transform: translateY(-2px);
  }

  /* Ripple Effect */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.7);
    animation: ripple-animation 0.6s linear;
    pointer-events: none;
    transform: scale(0);
  }

  @keyframes ripple-animation {
    to {
      transform: scale(4);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<button class="floating-button">Click Me</button>

<script>
  const button = document.querySelector('.floating-button');

  button.addEventListener('click', function (e) {
    const ripple = document.createElement('span');
    ripple.classList.add('ripple');

    const rect = button.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';

    // Position ripple in the click position relative to button
    ripple.style.left = e.clientX - rect.left - size / 2 + 'px';
    ripple.style.top = e.clientY - rect.top - size / 2 + 'px';

    button.appendChild(ripple);

    // Remove the ripple after animation
    ripple.addEventListener('animationend', () => {
      ripple.remove();
    });
  });
</script>

</body>
</html>
