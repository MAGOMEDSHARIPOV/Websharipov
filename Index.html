<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <style>
        /* Reset + Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #333;
      padding: 30px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeIn 1s ease;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1rem;
      color: #666;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background-color: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.15);
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #555;
      font-size: 0.95rem;
    }

    /* Ripple Effect */
    .ripple {
      position: absolute;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      transform: scale(0);
      animation: ripple 0.6s linear;
      pointer-events: none;
    }

    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 0.9rem;
      color: #999;
    }
  </style>
</head>
<body>
  <section class="hero scroll-reveal">
  <h1><span class="typed-name"></span></h1>
  <img src="your-photo.jpg" alt="My Photo" class="profile-pic" />

  <div class="socials">
    <a href="https://facebook.com/yourprofile" target="_blank">Facebook</a>
    <a href="https://instagram.com/yourprofile" target="_blank">Instagram</a>
  </div>
  </section>
<script>
  const name = "Juan Dela Cruz"; // ← Palitan ng pangalan mo
  const target = document.querySelector(".typed-name");
  let i = 0;

  function typeName() {
    if (i < name.length) {
      target.textContent += name.charAt(i);
      i++;
      setTimeout(typeName, 150);
    }
  }

  typeName();

  // Scroll animation
  function revealOnScroll() {
    const reveals = document.querySelectorAll('.scroll-reveal');
    reveals.forEach(el => {
      const rect = el.getBoundingClientRect();
      if (rect.top < window.innerHeight - 100) {
        el.classList.add('show');
      }
    });
  }
  window.addEventListener('scroll', revealOnScroll);
  window.addEventListener('load', revealOnScroll);
</script>
</body>

  <header>
    <h1>My Portfolio</h1>
    <p>Frontend Developer | Designer | Creative Thinker</p>
  </header>

  <section class="projects">
    <div class="card">
      <h3>Project 1</h3>
      <p>Simple landing page built with HTML & CSS</p>
    </div>
    <div class="card">
      <h3>Project 2</h3>
      <p>Responsive grid layout with animations</p>
    </div>
    <div class="card">
      <h3>Project 3</h3>
      <p>Portfolio site with language switch and effects</p>
    </div>
  </section>

  <footer>
    &copy; 2025 Your Name. All rights reserved.
  </footer>

  <script>
    // Add ripple effect on card click
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', function (e) {
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
        const rect = card.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = e.clientX - rect.left - size / 2 + 'px';
        ripple.style.top = e.clientY - rect.top - size / 2 + 'px';
        card.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      });
    });
  </script>

</body>
</html>
